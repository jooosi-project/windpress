# builds the content of https://github.com/jooosi-project/windpress
# inspiration from https://github.com/rectorphp/rector-src/blob/main/.github/workflows/build_scoped_rector.yaml
# TODO: trigger the FREE build only when the PRO build is successful. reference: https://github.blog/changelog/2022-09-08-github-actions-use-github_token-with-workflow_dispatch-and-repository_dispatch/
name: Deploy the Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  # see https://github.com/composer/composer/issues/9368#issuecomment-718112361
  COMPOSER_ROOT_VERSION: "dev-main"

jobs:
  build_scoped_windpress:
    # Don't run on forks.
    if: github.repository == 'jooosi-project/windpress'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # # sometime, when 2 or more consecutive PRs merged, the checkout jooosi-project/windpress is overlapped
      # # and reverting other commit change
      # # this should not happen on create a tag, so wait first
      # - name: "Wait before checkout jooosi-project/windpress on create a tag"
      #   if: "startsWith(github.ref, 'refs/tags/')"
      #   run: sleep 20

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use pnpm to install dependencies and build the assets.
      - uses: pnpm/setup@v2
        with:
          version: 12
          runtime: node@26
          cache: true

      - name: Set up Docker Buildx for Oxide
        uses: docker/setup-buildx-action@v3

      - run: pnpm build
        env:
          WP_I18N: "true"

      # scoped using php-scoper.phar which require #[\ReturnTypeWillChange] inside so use php 8.0 for scoping
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
          coverage: none
        # fixes https://github.com/rectorphp/rector/pull/4559/checks?check_run_id=1359814403, see https://github.com/shivammathur/setup-php#composer-github-oauth
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # preparing translations

      # install wp-cli
      - name: Setup WP-CLI
        uses: godaddy-wordpress/setup-wp-cli@1

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Extract changelog content before removing the file
      - name: "Extract changelog for version"
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if it exists
          VERSION_NO_V=${VERSION#v}
          CHANGELOG_CONTENT=$(node deploy/extract-changelog.js "$VERSION_NO_V")
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Update readme.txt changelog from CHANGELOG.md
      - name: "Update readme.txt changelog"
        run: deno run --allow-read --allow-write deploy/update-readme-changelog.ts

      # make pot file,
      - name: "Make pot file"
        run: php -d memory_limit=-1 /usr/local/bin/wp i18n make-pot ./ ./languages/windpress.pot

      # run the deno script to build the i18n.js file
      - name: "Build i18n.js"
        run: |
          deno run --allow-all deploy/build-i18n.ts
          rm -rf ./languages

      # # rebuild the assets
      # - run: pnpm build
      #   env:
      #     WP_I18N: 'false'

      # clean up the dev files
      - run: find assets -mindepth 1 -maxdepth 1 ! -name dist -exec rm -rf {} +
      - run: rm -rf resources node_modules deno.lock package.json pnpm-lock.yaml pnpm-workspace.yaml opencode.json README.md AGENTS.md vite.config.ts .npmrc tsconfig.json mago.toml eslint.config.js auto-imports.d.ts components.d.ts
      - run: rm -rf ecs.php rector.php
      - run: rm -rf CLAUDE.md .agents
      - run: rm -rf CHANGELOG.md

      - name: Verify third-party license notices
        run: |
          test -f licenses/lz-string-MIT.txt
          test -f licenses/tailwindcss-MIT.txt

      # install only prod dependencies
      - run: composer install --no-dev --classmap-authoritative --ansi

      # copy files to $NESTED_DIRECTORY directory Exclude the scoped/nested directories to prevent rsync from copying in a loop
      - run: rsync --exclude windpress-deploy -av * windpress-deploy --quiet

      # humbug/php-scoper requires php ^8.2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none

      # prefix the namespaces
      - run: sh deploy/deploy-scoped.sh windpress-deploy windpress-prefixed

      # clone remote repository, so we can push it
      - uses: actions/checkout@v4
        with:
          repository: wind-press/windpress-deployed
          ref: main
          path: remote-repository
          fetch-depth: 0
          token: ${{ secrets.ORG_DEV_PAT }}

      # remove remote files, to avoid piling up dead code in remote repository
      - working-directory: remote-repository
        run: |
          git rm -rf .
          git clean -fxd

      # copy files to remote repository
      - run: cp -a windpress-prefixed/. remote-repository

      # clean up the .wordpress-org directory as it is not needed
      - run: rm -rf remote-repository/.wordpress-org

      # setup git
      - working-directory: remote-repository
        run: |
          git config user.name "Joshua Gugun Siagian"
          git config user.email suabahasa@gmail.com

      # commit metadata
      - name: "Get Git log"
        id: git-log
        run: |
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$(git log ${{ github.event.before }}..${{ github.event.after }} --reverse --pretty='https://github.com/jooosi-project/windpress/commit/%H %s')" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      # publish it to remote repository with tag
      - name: "Commit Prefixed - tag"
        working-directory: remote-repository
        if: "startsWith(github.ref, 'refs/tags/')"
        env:
          INPUT_LOG: ${{ steps.git-log.outputs.log }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if it exists
          VERSION_NO_V=${VERSION#v}
          git add --all
          git commit -m "WindPress $VERSION_NO_V" -m "$INPUT_LOG"
          git push --quiet origin main
          git tag $VERSION_NO_V -m "$VERSION_NO_V"
          git push --quiet origin $VERSION_NO_V

      # WordPress.org build

      # Get the current tag from github.ref, where the tag name is the version number.
      # tag name pattern: X.Y.Z, where X, Y, Z are integers
      # reduce the Y by 1, then build the tag name
      # save the tag name as `WP_ORG_VERSION` variable to file $GITHUB_ENV
      # Note, set-output is deprecated, so use alternative instead of ::set-output
      - run: |
          VERSION=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if it exists
          VERSION_NO_V=${VERSION#v}
          echo "WP_ORG_VERSION=$(echo $VERSION_NO_V | awk -F. '{print $1"."$2-1"."$3}')" >> $GITHUB_ENV

      - run: ls -la

      # remove the $NESTED_DIRECTORY directory
      - run: rm -rf windpress-deploy remote-repository windpress-prefixed
      # remove the vendor directory
      - run: rm -rf vendor

      # keep this folders (Free):
      # - Gutenberg
      # - Elementor
      # - GreenShift
      # - Kadence
      # - Timber
      # - LiveCanvas
      # - Builderius (Planned)
      # else, remove the premium version
      - run: rm -rf src/Integration/{Blockstudio,Builderius,Breakdance,Beaver,Blocksy,Bricks,Cwicly,Divi,Etch,MetaBox,Oxygen,OxygenClassic,WPCodeBox2}

      - run: ls -la

      # scoped using php-scoper.phar which require #[\ReturnTypeWillChange] inside so use php 8.0 for scoping
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
          coverage: none
        # fixes https://github.com/rectorphp/rector/pull/4559/checks?check_run_id=1359814403, see https://github.com/shivammathur/setup-php#composer-github-oauth
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # remove custom update library
      - run: composer remove rosua/edd-sl-plugin-updater --ansi

      # decrease the version
      - run: deno run --allow-read --allow-write deploy/decrease-version.ts

      # install only prod dependencies
      - run: composer install --no-dev --classmap-authoritative --ansi

      # copy files to $NESTED_DIRECTORY directory Exclude the scoped/nested directories to prevent rsync from copying in a loop
      - run: rsync --exclude windpress-deploy -av * windpress-deploy --quiet

      # humbug/php-scoper requires php ^8.2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none

      # prefix the namespaces
      - run: sh deploy/deploy-scoped.sh windpress-deploy windpress-prefixed

      # deploy to WordPress.org SVN repository
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: windpress
          BUILD_DIR: windpress-prefixed
          VERSION: ${{ env.WP_ORG_VERSION }}

      # Create GitHub Release with changelog and zip file
      - name: "Create plugin zip file"
        run: |
          mkdir -p windpress-zip/windpress
          cp -r windpress-prefixed/* windpress-zip/windpress/
          cd windpress-zip
          zip -r "../windpress-${{ env.WP_ORG_VERSION }}-free.zip" . -x "*.git*" "*.DS_Store*"
          cd ..
          ls -la windpress-*.zip

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        if: "startsWith(github.ref, 'refs/tags/')"
        with:
          name: "${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.content }}
          files: |
            windpress-${{ env.WP_ORG_VERSION }}-free.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_DEV_PAT }}
