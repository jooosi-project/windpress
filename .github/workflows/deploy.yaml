name: Deploy Free and Pro editions

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  COMPOSER_ROOT_VERSION: dev-main

jobs:
  release:
    if: github.repository == 'jooosi-project/windpress'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve edition versions
        id: versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "The release tag must be a semantic version such as 3.3.0 or v3.3.0." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( minor < 1 )); then
            echo "The Pro minor version must be at least 1 so a Free version can be derived." >&2
            exit 1
          fi

          pro_version="${major}.${minor}.${patch}"
          free_version="${major}.$((minor - 1)).${patch}"

          echo "pro=${pro_version}" >> "$GITHUB_OUTPUT"
          echo "free=${free_version}" >> "$GITHUB_OUTPUT"
          echo "PRO_VERSION=${pro_version}" >> "$GITHUB_ENV"
          echo "FREE_VERSION=${free_version}" >> "$GITHUB_ENV"

      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        env:
          WP_I18N: "true"
        run: pnpm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Extract release notes
        id: changelog
        shell: bash
        run: |
          {
            echo "content<<EOF"
            node deploy/extract-changelog.mjs "$PRO_VERSION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update WordPress.org changelog
        run: node deploy/update-readme-changelog.mjs

      - name: Install WP-CLI
        uses: godaddy-wordpress/setup-wp-cli@1

      - name: Build translation assets
        shell: bash
        run: |
          wp i18n make-pot ./ ./languages/windpress.pot
          node deploy/build-i18n.mjs
          rm -rf ./languages

      - name: Prepare Pro source
        shell: bash
        run: |
          mkdir -p windpress-deploy
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='vendor' \
            --exclude='windpress-deploy' \
            --exclude='windpress-*-prefixed' \
            --exclude='dist-branch' \
            --exclude='dist-free-branch' \
            ./ windpress-deploy/

          composer install \
            --working-dir=windpress-deploy \
            --no-dev \
            --classmap-authoritative \
            --no-interaction \
            --prefer-dist \
            --ansi

      - name: Scope Pro edition dependencies
        run: bash deploy/deploy-scoped.sh windpress-deploy windpress-pro-prefixed --keep-source

      - name: Prepare Pro artifact
        shell: bash
        run: |
          node deploy/add-pro-update-uri.mjs windpress-pro-prefixed

          mkdir -p windpress-pro-prefixed-filtered
          rsync -a \
            --exclude='.*' \
            --exclude-from=.distignore \
            windpress-pro-prefixed/ \
            windpress-pro-prefixed-filtered/
          rm -rf windpress-pro-prefixed
          mv windpress-pro-prefixed-filtered windpress-pro-prefixed

      - name: Verify Pro edition
        shell: bash
        run: |
          pro=windpress-pro-prefixed
          update_uri='https://jooo.si'

          grep -Fq "* Version:             ${PRO_VERSION}" "$pro/windpress.php"
          grep -Fq "public const VERSION = '${PRO_VERSION}';" "$pro/constant.php"
          grep -Fq "* Update URI:        ${update_uri}" "$pro/windpress.php"
          grep -Fq 'use EasyDigitalDownloads\Updater\Registry;' "$pro/src/Plugin.php"
          # PHP-Scoper may qualify the boolean literal as \true.
          grep -Eq "'wp_override'[[:space:]]*=>[[:space:]]*\\\\?true" "$pro/src/Licensing/Manager.php"
          test -f "$pro/vendor/easy-digital-downloads/edd-sl-sdk/edd-sl-sdk.php"
          grep -Fq "add_action( 'after_setup_theme', array( '\\\\EasyDigitalDownloads\\\\Updater\\\\Versions'" \
            "$pro/vendor/easy-digital-downloads/edd-sl-sdk/edd-sl-sdk.php"

      - name: Publish Pro build to dist branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-branch
          cd dist-branch
          git fetch origin dist || true
          git checkout dist 2>/dev/null || git checkout --orphan dist
          git rm -rf . 2>/dev/null || true
          git clean -fxd
          cp -a ../windpress-pro-prefixed/. .
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "The dist branch already matches Pro ${PRO_VERSION}."
          else
            git commit -m "Build Pro ${PRO_VERSION}"
            git push origin dist
          fi

      - name: Prepare Free edition
        shell: bash
        run: |
          rm -rf \
            windpress-deploy/src/Integration/Blockstudio \
            windpress-deploy/src/Integration/Builderius \
            windpress-deploy/src/Integration/Breakdance \
            windpress-deploy/src/Integration/Beaver \
            windpress-deploy/src/Integration/Blocksy \
            windpress-deploy/src/Integration/Bricks \
            windpress-deploy/src/Integration/Cwicly \
            windpress-deploy/src/Integration/Divi \
            windpress-deploy/src/Integration/Etch \
            windpress-deploy/src/Integration/MetaBox \
            windpress-deploy/src/Integration/Oxygen \
            windpress-deploy/src/Integration/OxygenClassic \
            windpress-deploy/src/Integration/WPCodeBox2

          node deploy/decrease-version.mjs windpress-deploy
          composer remove \
            --working-dir=windpress-deploy \
            easy-digital-downloads/edd-sl-sdk \
            --update-no-dev \
            --classmap-authoritative \
            --no-interaction \
            --no-progress \
            --ansi

      - name: Scope Free edition dependencies
        run: bash deploy/deploy-scoped.sh windpress-deploy windpress-free-prefixed

      - name: Prepare Free artifact
        shell: bash
        run: |
          mkdir -p windpress-free-prefixed-filtered
          rsync -a \
            --exclude='.*' \
            --exclude-from=.distignore \
            windpress-free-prefixed/ \
            windpress-free-prefixed-filtered/
          rm -rf windpress-free-prefixed
          mv windpress-free-prefixed-filtered windpress-free-prefixed

      - name: Verify Free edition
        shell: bash
        run: |
          free=windpress-free-prefixed

          grep -Fq "* Version:             ${FREE_VERSION}" "$free/windpress.php"
          grep -Fq "public const VERSION = '${FREE_VERSION}';" "$free/constant.php"
          grep -Fq "Stable tag: ${FREE_VERSION}" "$free/readme.txt"

          if grep -Eiq '^[[:space:]]*\*[[:space:]]*Update URI:' "$free/windpress.php"; then
            echo "The Free artifact must not contain a custom Update URI." >&2
            exit 1
          fi

          if [[ -d "$free/vendor/easy-digital-downloads/edd-sl-sdk" ]]; then
            echo "The Free artifact must not contain the EDD Software Licensing SDK." >&2
            exit 1
          fi

          for directory in Blockstudio Builderius Breakdance Beaver Blocksy Bricks Cwicly Divi Etch MetaBox Oxygen OxygenClassic WPCodeBox2; do
            if [[ -d "$free/src/Integration/$directory" ]]; then
              echo "The Free artifact contains Pro integration: $directory" >&2
              exit 1
            fi
          done

      - name: Publish Free build to dist-free branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-free-branch
          cd dist-free-branch
          git fetch origin dist-free || true
          git checkout dist-free 2>/dev/null || git checkout --orphan dist-free
          git rm -rf . 2>/dev/null || true
          git clean -fxd
          cp -a ../windpress-free-prefixed/. .
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "The dist-free branch already matches Free ${FREE_VERSION}."
          else
            git commit -m "Build Free ${FREE_VERSION}"
            git push origin dist-free
          fi

      - name: Publish Free edition to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WORDPRESS_ORG_SVN_USERNAME || secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WORDPRESS_ORG_SVN_PASSWORD || secrets.SVN_PASSWORD }}
          SLUG: windpress
          BUILD_DIR: windpress-free-prefixed
          VERSION: ${{ steps.versions.outputs.free }}
          ASSETS_DIR: .wordpress-org

      - name: Create Free plugin archive
        shell: bash
        run: |
          mkdir -p windpress-free-zip/windpress
          cp -a windpress-free-prefixed/. windpress-free-zip/windpress/
          cd windpress-free-zip
          zip -qr "../windpress-${FREE_VERSION}-free.zip" windpress -x "*.git*" "*.DS_Store*"

      - name: Upload Free plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: windpress-${{ steps.versions.outputs.free }}-free
          path: windpress-${{ steps.versions.outputs.free }}-free.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          files: windpress-${{ steps.versions.outputs.free }}-free.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
